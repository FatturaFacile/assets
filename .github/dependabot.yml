version: 2
updates:
  # GitHub Actions: one grouped PR per week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    assignees:
      - "aledv"
      - "davide-nava"
    groups:
      github-actions:
        patterns:
          - "*"
