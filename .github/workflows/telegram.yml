name: Telegram Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, closed]
  issues:
    types: [opened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    # Dependabot runs get no repository secrets
    if: github.actor != 'dependabot[bot]'
    uses: FatturaFacile/FatturaFacile/.github/workflows/reusable-telegram.yml@main
    secrets: inherit
